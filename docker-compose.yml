services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: simbo
      POSTGRES_PASSWORD: simbo
      POSTGRES_DB: simbo
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simbo -d simbo']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - simbo_pg:/var/lib/postgresql/data
volumes:
  simbo_pg:
