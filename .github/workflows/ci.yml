name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simbo
          POSTGRES_PASSWORD: simbo
          POSTGRES_DB: simbo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U simbo -d simbo_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://simbo:simbo@localhost:5432/simbo_test?schema=public
      TEST_DATABASE_URL: postgresql://simbo:simbo@localhost:5432/simbo_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm prisma:generate
      - run: pnpm prisma:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencia-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
